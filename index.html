    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- CSS Connection -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Please login to your account
            </p>

            <form>

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </div>

    </div>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    width: 100%;
    padding: 20px;
}

.login-box {
    width: 400px;
    max-width: 100%;

    margin: auto;

    background: white;

    padding: 40px;

    border-radius: 20px;

    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #667eea;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 32px;
}

h1 {
    text-align: center;
    color: #222;

    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;

    margin-bottom: 30px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;
    font-weight: bold;

    color: #333;
}

.input-group input {
    width: 100%;

    padding: 13px 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

    outline: none;

    transition: 0.3s;
}

.input-group input:focus {
    border-color: #667eea;

    box-shadow:
        0 0 0 3px rgba(102, 126, 234, 0.15);
}

.options {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;

    font-size: 13px;
}

.remember {
    display: flex;
    align-items: center;

    gap: 6px;

    color: #555;
}

.options a {
    color: #667eea;

    text-decoration: none;

    font-weight: bold;
}

.options a:hover {
    text-decoration: underline;
}

button {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #667eea;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

button:hover {
    background: #5568d8;

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(102, 126, 234, 0.3);
}

.signup {
    text-align: center;

    margin-top: 25px;

    color: #777;

    font-size: 14px;
}

.signup a {
    color: #667eea;

    text-decoration: none;

    font-weight: bold;
}

.signup a:hover {
    text-decoration: underline;
}


/* Mobile Responsive */

@media (max-width: 480px) {

    .login-box {
        padding: 30px 20px;
    }

    h1 {
        font-size: 25px;
    }

    .options {
        flex-direction: column;

        align-items: flex-start;

        gap: 10px;
    }
}
    </style>

</body>
</html>
</body>
</html>
